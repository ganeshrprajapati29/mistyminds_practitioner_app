<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="g" x1="22" y1="20" x2="74" y2="76" gradientUnits="userSpaceOnUse">
    <stop stop-color="#9B72F2"/>
